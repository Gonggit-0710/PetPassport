<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PawLog 글 관리</title>
<link rel="stylesheet" href="/pawlog/blog.css?v=3"><style>main{max-width:1180px}.workspace{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px}aside button{display:block;width:100%;text-align:left;margin:10px 0}label{display:block;margin:14px 0 6px}input,textarea,select,button{font:inherit}input,textarea{width:100%;padding:10px;border:1px solid #c6cbd3;border-radius:8px;background:white}button,.photo-button{cursor:pointer;background:white;border:1px solid #c6cbd3;border-radius:8px;padding:8px 14px;color:var(--ink)}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--ink);color:white}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>label{flex:1;min-width:180px}.toolbar{position:sticky;top:0;z-index:2;background:var(--paper);padding:12px 0}.editor{min-height:400px;background:white;border:1px solid #c6cbd3;border-radius:12px;padding:24px;margin-top:12px}.editor:focus{outline:2px solid var(--ink)}.editor img{max-width:100%;cursor:pointer}.editor img.selected-photo{outline:3px solid var(--accent)}.editor table{display:block;overflow-x:auto}.hint{font-size:14px;color:var(--sub)}#message{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;background:#edf1f6;border-radius:10px}#preview{width:100%;height:800px;border:1px solid #c6cbd3;background:white}#coverPreview{max-width:150px;max-height:100px}#previewArea[hidden]{display:none}.draft-label{margin-top:24px}body.busy{cursor:wait}@media(max-width:800px){.workspace{grid-template-columns:1fr}aside{border-bottom:1px solid var(--line)}.editor{padding:16px}.toolbar{position:static}}</style></head><body>
<header><a class="brand admin-brand" href="/admin/" aria-label="PawTrip · PawLog 관리"><img src="/media/logo-light.svg" alt="PawTrip"><span>PawLog 관리</span></a><a href="/pawlog/" target="_blank" rel="noopener">홈페이지 미리보기 ↗</a></header>
<main><p class="hint">이 PC에서 글을 관리합니다. 게시 후 GitHub Desktop에서 커밋 → Push origin으로 운영 사이트에 반영하세요.</p><div class="workspace"><aside><button id="newPost">＋ 새 이야기</button><h2>게시한 글</h2><div id="postList"></div><h2 class="draft-label">저장한 초안</h2><div id="draftList"></div></aside><section>
<label for="title">제목</label><input id="title" maxlength="200" placeholder="공이와 함께한 오늘의 이야기">
<div class="row"><label>글 주소<input id="slug" placeholder="gong-jeju-trip" pattern="[a-z0-9]+(-[a-z0-9]+)*"></label><label>게시 날짜<input id="date" type="date"></label></div>
<label for="excerpt">목록에 보여줄 짧은 소개</label><textarea id="excerpt" rows="2" maxlength="300"></textarea>
<label for="source">네이버 원문 링크 (선택)</label><input id="source" type="url" placeholder="https://blog.naver.com/pawtrip/...">
<label for="caption">사진 설명</label><input id="caption" placeholder="예: 레이크 타호 호숫가를 걷는 공이">
<div class="row"><label class="photo-button">사진 업로드<input id="photo" type="file" accept="image/jpeg,image/png,image/webp" hidden multiple></label><button id="coverButton" type="button">대표 사진 업로드</button><input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp" hidden><img id="coverPreview" alt="대표 사진 미리보기" hidden><button id="removeCover">대표 사진 제거</button></div>
<p class="hint">JPG·PNG·WebP, 사진당 10MB 이하. 사진 설명을 입력한 뒤 업로드하면 본문에 삽입됩니다. 본문 사진을 클릭한 뒤 아래 버튼으로 위치를 옮기거나 설명을 수정·삭제할 수 있습니다.</p>
<label id="bodyLabel">본문</label><div class="toolbar row"><button data-command="formatBlock" data-value="p">본문</button><button data-command="formatBlock" data-value="h2">소제목</button><button data-command="bold">굵게</button><button data-command="insertUnorderedList">목록</button><button id="linkButton">링크</button><button id="photoUp">사진 위로</button><button id="photoDown">사진 아래로</button><button id="photoCaption">사진 설명 수정</button><button id="photoDelete">사진 삭제</button><button data-command="undo">되돌리기</button></div>
<div id="editor" class="editor story" contenteditable="true" role="textbox" aria-labelledby="bodyLabel" aria-multiline="true"></div>
<div class="row" style="margin-top:24px"><button id="saveDraft">초안 저장</button><button id="previewButton">미리보기</button><button id="publish" class="primary">홈페이지에 게시</button></div><p id="message" role="status" aria-live="polite">새 글을 작성하거나 왼쪽에서 기존 글을 선택하세요.</p>
<section id="previewArea" hidden><h2>게시 전 미리보기</h2><iframe id="preview" title="PawLog 글 미리보기" sandbox="allow-same-origin"></iframe></section>
</section></div></main><script>
const token='__TOKEN__', $=id=>document.getElementById(id);let original='',version='',draftId='',cover='',dirty=false,busy=false,savedRange=null,selectedPhoto=null;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fields=['title','slug','date','excerpt','source'];
function post(){return Object.fromEntries([...fields.map(id=>[id,$(id).value]),['body',$('editor').innerHTML],['cover',cover]])}
function setMessage(s){$('message').textContent=s}
async function api(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-PawLog-Token':token},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error);return v}
async function action(fn){if(busy)return;busy=true;document.body.classList.add('busy');document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){setMessage(e.message)}finally{busy=false;document.body.classList.remove('busy');document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function discard(){return !dirty||confirm('저장하지 않은 변경이 있습니다. 다른 글을 열까요?')}
function load(data){const p=data.post||data;fields.forEach(id=>$(id).value=p[id]||'');$('editor').innerHTML=p.body||'<p><br></p>';cover=p.cover||'';original=data.original||'';version=data.version||'';draftId=data.draftId||'';$('slug').readOnly=!!original;showCover();dirty=false;savedRange=null;selectedPhoto=null;$('previewArea').hidden=true;setMessage('글을 불러왔습니다. 수정 후 초안 저장 또는 게시를 눌러 주세요.')}
function showCover(){$('coverPreview').hidden=!cover;if(cover)$('coverPreview').src=cover;else $('coverPreview').removeAttribute('src')}
async function refresh(){const r=await fetch('/api/posts');const data=await r.json();$('postList').replaceChildren();$('draftList').replaceChildren();for(const p of data.posts){const b=document.createElement('button');b.textContent=p.title;b.onclick=()=>action(async()=>{if(!discard())return;version=p._version;load({post:p,original:p.slug,version});});$('postList').append(b)}for(const d of data.drafts){const b=document.createElement('button');b.textContent=d.post.title||'제목 없는 초안';b.onclick=()=>{if(discard())load(d)};$('draftList').append(b)}}
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&$('editor').contains(s.anchorNode))savedRange=s.getRangeAt(0).cloneRange()});
function focusEditor(){$('editor').focus();if(savedRange&&$('editor').contains(savedRange.commonAncestorContainer)){const s=getSelection();s.removeAllRanges();s.addRange(savedRange)}else{const r=document.createRange();r.selectNodeContents($('editor'));r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}}
document.querySelectorAll('[data-command]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{focusEditor();document.execCommand(b.dataset.command,false,b.dataset.value||null);dirty=true}});

$('editor').addEventListener('click',e=>{if(e.target.tagName==='IMG'){document.querySelectorAll('.selected-photo').forEach(i=>i.classList.remove('selected-photo'));selectedPhoto=e.target;selectedPhoto.classList.add('selected-photo');$('caption').value=selectedPhoto.alt||''}});
function photoBlock(){if(!selectedPhoto||!$('editor').contains(selectedPhoto)){setMessage('먼저 본문 사진을 클릭해 주세요.');return null}return selectedPhoto.closest('figure')||selectedPhoto}
$('photoUp').onclick=()=>{const p=photoBlock();if(!p)return;const before=p.previousElementSibling;if(before){p.parentNode.insertBefore(p,before);dirty=true;savedRange=null}};
$('photoDown').onclick=()=>{const p=photoBlock();if(!p)return;const after=p.nextElementSibling;if(after){p.parentNode.insertBefore(after,p);dirty=true;savedRange=null}};
$('photoDelete').onclick=()=>{const p=photoBlock();if(!p)return;p.remove();selectedPhoto=null;savedRange=null;dirty=true};
$('photoCaption').onclick=()=>{const p=photoBlock();if(!p)return;const caption=$('caption').value.trim();selectedPhoto.alt=caption;if(p.tagName==='FIGURE'){let el=p.querySelector('figcaption');if(!el){el=document.createElement('figcaption');p.append(el)}el.textContent=caption}dirty=true};

$('editor').addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))});
$('editor').addEventListener('drop',e=>{e.preventDefault();setMessage('사진 업로드 버튼으로 사진을 추가해 주세요.')});
$('linkButton').onclick=()=>{const u=prompt('링크 주소 (https://...)');if(!u)return;try{const url=new URL(u);if(!['https:','http:'].includes(url.protocol))throw Error();focusEditor();document.execCommand('createLink',false,url.href);dirty=true}catch{setMessage('http 또는 https 주소를 입력해 주세요.')}};
async function upload(f){if(f.size>10000000)throw Error('사진은 10MB 이하로 선택해 주세요.');const bitmap=await createImageBitmap(f);bitmap.close();const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});return (await api('/api/upload',{data})).url}
$('photo').onchange=()=>action(async()=>{for(const f of $('photo').files){const u=await upload(f),caption=$('caption').value.trim()||f.name;focusEditor();document.execCommand('insertHTML',false,`<figure><img src="${escapeHTML(u)}" alt="${escapeHTML(caption)}"><figcaption>${escapeHTML(caption)}</figcaption></figure><p><br></p>`);if(!cover){cover=u;showCover()}dirty=true}$('photo').value='';setMessage('사진을 추가했습니다. 초안 저장 또는 게시를 눌러 주세요.')});
$('coverButton').onclick=()=>$('coverFile').click();$('coverFile').onchange=()=>action(async()=>{if(!$('coverFile').files[0])return;cover=await upload($('coverFile').files[0]);showCover();dirty=true;$('coverFile').value='';setMessage('대표 사진을 선택했습니다.')});$('removeCover').onclick=()=>{cover='';showCover();dirty=true};
$('newPost').onclick=()=>{if(!discard())return;const d=new Date();load({post:{date:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}});setMessage('새 이야기를 작성해 주세요.')};
document.querySelectorAll('input,textarea,#editor').forEach(e=>e.addEventListener('input',()=>dirty=true));
$('saveDraft').onclick=()=>action(async()=>{const r=await api('/api/draft',{post:post(),original,version,draftId});draftId=r.draftId;dirty=false;await refresh();setMessage('초안을 이 PC에 저장했습니다. 홈페이지에는 아직 게시되지 않습니다.')});
$('previewButton').onclick=()=>{const p=post();$('previewArea').hidden=false;$('preview').srcdoc=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/pawlog/blog.css"><title>미리보기</title></head><body><main><article><p class="eyebrow">공이와 함께, 여행도 일상도.</p><h1>${escapeHTML(p.title)}</h1><div class="meta">${escapeHTML(p.date)}</div><div class="story">${p.body}</div></article></main></body></html>`;$('previewArea').scrollIntoView({behavior:'smooth'})};
$('publish').onclick=()=>action(async()=>{const r=await api('/api/publish',{post:post(),original,version,draftId});original=$('slug').value;version=r.version;draftId='';dirty=false;$('slug').readOnly=true;await refresh();setMessage(r.message+'\n미리보기: '+location.origin+r.url)});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});$('newPost').click();refresh().catch(e=>setMessage(e.message));
</script></body></html>
