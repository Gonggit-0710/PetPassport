<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="한국에서 반려견과 해외여행을 떠날 때 필요한 국가별 입국 검역 규정, 항공사 반려동물 탑승 규정, 출국일 역산 준비 일정을 공식 출처 기준으로 정리했습니다.">
<meta name="keywords" content="반려견 해외여행, 강아지 해외여행, 반려동물 검역, 강아지 비행기, 반려동물 항공 규정, 일본 강아지 입국, 광견병 항체검사">
<meta property="og:type" content="website">
<meta property="og:title" content="펫패스포트 · 반려견과 해외여행 준비">
<meta property="og:description" content="국가별 입국 검역, 항공사 탑승 규정, 출국일 역산 일정을 한 곳에서.">
<meta property="og:locale" content="ko_KR">
<meta name="theme-color" content="#EFF4F6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232E6A86'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' fill='%23FFFFFF' text-anchor='middle'%3EP%3C/text%3E%3Ccircle cx='47' cy='18' r='6' fill='%23E3A67C'/%3E%3C/svg%3E">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>펫패스포트 · 반려견과 해외여행 준비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=DM+Mono:wght@400;500&family=Instrument+Serif&display=swap">
<style>
/* Layout: 리비에라 오후 · 아침 안개 바탕. 상단 탭 + 좌측 입력 / 우측 결과, 폰에서는 한 줄로 쌓임 */
:root{
  --paper:#EFF4F6; --sheet:#FFFFFF; --ink:#1C2B36; --muted:#5E6872; --line:#D5E0E5;
  --stamp:#2E6A86; --stamp-soft:#DDEBF1; --stamp-ink:#FFFFFF; --sun:#C97A4C;
  --ok:#3E6E50; --ok-soft:#E3EFE7; --warn:#8C5A10; --warn-soft:#F5ECD9; --bad:#A5412F; --bad-soft:#F6E4E0;
  --f-display:"Hahmlet","Noto Serif KR",Georgia,serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  --f-logo:"Instrument Serif",Georgia,serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111B23; --sheet:#18252F; --ink:#E8EDF0; --muted:#98A6B0; --line:#253643;
  --stamp:#7DB6D1; --stamp-soft:#1B3140; --stamp-ink:#111B23; --sun:#E3A67C;
  --ok:#82BD97; --ok-soft:#173026; --warn:#E8B55A; --warn-soft:#322711; --bad:#EC8C78; --bad-soft:#3A1E19; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111B23; --sheet:#18252F; --ink:#E8EDF0; --muted:#98A6B0; --line:#253643;
  --stamp:#7DB6D1; --stamp-soft:#1B3140; --stamp-ink:#111B23; --sun:#E3A67C;
  --ok:#82BD97; --ok-soft:#173026; --warn:#E8B55A; --warn-soft:#322711; --bad:#EC8C78; --bad-soft:#3A1E19; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;padding:0 16px}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 56px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;text-wrap:balance;line-height:1.3;margin:0}
h4,.acard h4,tbody th{font-family:var(--f-body);font-weight:600}
a{color:var(--stamp)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono)}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-family:var(--f-logo);font-size:34px;line-height:1;letter-spacing:.005em;font-weight:400}
.logo span{color:var(--sun)}
.brand{flex-direction:column;align-items:flex-start;gap:6px}
.brand p{margin:0;font-size:13.5px}
.verified{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);padding:2px 10px;border-radius:999px;font-size:12.5px;white-space:nowrap}

/* tabs */
nav.tabs{display:flex;gap:4px;margin:16px 0 20px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:8px 14px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;font-size:14.5px}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--paper)}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]:hover{color:var(--paper)}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid-plan{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.grid-plan{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:500}
.form{display:flex;flex-direction:column;gap:16px}
input[type=date],input[type=number],select{font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:5px;accent-color:var(--stamp)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.sub{display:flex;flex-direction:column;gap:6px;padding-left:26px}

/* result */
.verdict{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-start;padding-bottom:16px;border-bottom:1px dashed var(--line)}
.verdict .big{font-family:var(--f-mono);font-size:30px;font-weight:500;line-height:1.15;letter-spacing:-.01em}
.stamp{display:inline-block;border:1.5px solid currentColor;border-radius:999px;padding:3px 12px;font-family:var(--f-body);font-weight:600;font-size:13.5px;letter-spacing:.02em}
.stamp.ok{color:var(--ok)} .stamp.bad{color:var(--bad)} .stamp.warn{color:var(--warn)}
.section-h{font-size:15px;font-weight:600;margin:20px 0 10px;font-family:var(--f-body)}
ol.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ol.tl li{display:grid;grid-template-columns:112px 16px minmax(0,1fr);gap:10px;align-items:start;padding:6px 0}
ol.tl .dt{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:right;padding-top:2px}
ol.tl .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--stamp);margin-top:7px;position:relative}
ol.tl li.past .dot{border-color:var(--bad);background:var(--bad)}
ol.tl li.past .dt{color:var(--bad)}
ol.tl li:last-child .dot{background:var(--stamp)}
@media (max-width:480px){ol.tl li{grid-template-columns:88px 14px minmax(0,1fr)}}

.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.acard{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.acard h4{margin:0;font-size:15px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.pill{font-size:12px;padding:1px 8px;border-radius:999px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--stamp-soft);color:var(--stamp)}
.callout{border-radius:8px;padding:12px 14px;font-size:14px;margin-top:12px}
.callout.warn{background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn)}
.callout.bad{background:var(--bad-soft);border-left:3px solid var(--bad)}
.callout.info{background:var(--stamp-soft);border-left:3px solid var(--stamp)}
.callout strong{display:block;margin-bottom:2px}

/* countries */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.toolbar button{font:inherit;font-size:13.5px;padding:6px 12px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;cursor:pointer}
.toolbar button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ccard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:border-color .15s}
.ccard:hover{border-color:var(--stamp)}
.ccard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.code{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted)}
.ccard h3{font-size:19px}
.meter{display:inline-flex;gap:3px;align-items:center}
.meter i{width:14px;height:6px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--ink)}
.meter.d5 i.on,.meter.d4 i.on{background:var(--bad)}
.ccard .lead{font-family:var(--f-mono);font-size:13px}
.ccard p{margin:0;font-size:13.5px;color:var(--muted)}

.detail-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:16px}
.detail-head h2{font-size:28px}
.back{font-size:14px;text-decoration:none;display:inline-block;margin-bottom:10px}
.dgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.dgrid{grid-template-columns:1fr}}
ul.req{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
ul.req li label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
ul.req li:last-child label{border-bottom:0}
ul.req input{margin-top:6px;accent-color:var(--ok)}
ul.req input:checked + span{color:var(--muted);text-decoration:line-through}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.src{font-size:13px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.src ul{margin:4px 0 0;padding-left:18px}

/* airline table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
table{border-collapse:collapse;width:100%;min-width:820px;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
thead th{font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:500;background:var(--paper);position:sticky;top:0}
tbody th{font-size:14.5px;white-space:nowrap}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
td .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.breed{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
.breed .field{flex:1 1 220px}
input[type=text]{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.breed-out{font-size:14px;min-height:1.5em}

.tel{font-size:13.5px}
.sel{user-select:all}
.foot{margin-top:28px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="mast">
    <div class="brand">
      <h1 class="logo" aria-label="펫패스포트"><span>Pet</span>Passport</h1>
      <p class="muted">반려견과 함께 떠나는 해외여행, 검역부터 탑승까지</p>
    </div>
    <div class="verified">
      <span class="chip">출발지 <strong>대한민국</strong></span>
      <span class="chip">규정 확인일 <span class="mono" id="vdate">2026-09-29</span></span>
    </div>
  </header>

  <nav class="tabs" aria-label="섹션">
    <a href="#flights" data-tab="flights">항공편 선택</a>
    <a href="#plan" data-tab="plan">일정 계산</a>
    <a href="#countries" data-tab="countries">국가별 입국 규정</a>
    <a href="#airlines" data-tab="airlines">항공사 비교</a>
    <a href="#return" data-tab="return">귀국 검역</a>
    <a href="#about" data-tab="about">기준과 출처</a>
  </nav>

  <main id="app"><p class="muted">규정 데이터를 불러오는 중입니다…</p></main>

  <p class="foot">펫패스포트는 공식 출처를 요약한 참고 자료입니다. 각국 검역당국과 항공사는 규정을 예고 없이 바꿉니다. 출국 전 각 항목의 출처 링크에서 최신 내용을 다시 확인하세요. 입국 거부·격리에 대한 책임은 지지 않습니다.</p>
</div>

<script>
(function(){
  const app = document.getElementById('app');
  let DATA = null;
  const state = { dest:'jp', dep:'', weight:6, brachy:false, chip:true, titer:false, blood:'' };
  const today = new Date(); today.setHours(0,0,0,0);

  // ---------- date helpers ----------
  const pad = n => String(n).padStart(2,'0');
  const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const parse = s => { if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
  const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
  const addMonths = (d,n) => { const x=new Date(d); const day=x.getDate(); x.setMonth(x.getMonth()+n); if(x.getDate()<day) x.setDate(0); return x; };
  const fmt = d => d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate());
  const diff = (a,b) => Math.round((a-b)/86400000);
  const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // 가장 빠른 출국 가능일: 이미 채혈했으면 채혈일 기준으로 다시 계산
  function earliest(c){
    const blood = state.titer ? parse(state.blood) : null;
    if(blood){
      if(c.id==='jp') return addDays(blood,180);
      if(['fr','de','gb'].includes(c.id)) return addMonths(blood,3);
      if(c.id==='sg') return addDays(blood,90);
      if(c.id==='au') return addDays(blood,185);
      if(c.id==='cn') return addDays(blood,21);
    }
    let lead = c.leadDays;
    if(!state.chip && lead<30 && ['us'].includes(c.id)) lead = 7;
    return addDays(today, lead);
  }
  const titerCountry = id => ['jp','fr','de','gb','sg','au','cn'].includes(id);
  const cargoOnly = id => ['gb','au'].includes(id);
  const regionName = {short:'단거리',mid:'중거리',long:'장거리'};

  // ---------- airline eligibility for a route ----------
  function airlineFor(a,c){
    const w = Number(state.weight)||0;
    const out = {cabin:null, checked:null, reason:[]};
    if(a.status==='pending'){ out.cabin='?'; out.checked='?'; out.reason.push('공식 규정 확인 대기'); return out; }
    if(cargoOnly(c.id)){ out.cabin=false; out.checked=false; out.reason.push(c.name+'은(는) 기내·위탁 불가, 화물 운송만 가능'); return out; }
    if(a.cabin.maxKg==null) out.cabin='?';
    else out.cabin = w<=a.cabin.maxKg;
    if(out.cabin===false) out.reason.push('기내 한도 '+a.cabin.maxKg+'kg 초과');
    if(a.checked.allowed===false){ out.checked=false; }
    else if(a.checked.allowed==null){ out.checked='?'; }
    else {
      out.checked = w<=a.checked.maxKg;
      if(state.brachy && a.brachyChecked===false){ out.checked=false; out.reason.push('단두종 위탁 불가'); }
    }
    return out;
  }
  const yn = v => v===true?'<span class="pill ok">가능</span>':v===false?'<span class="pill bad">불가</span>':'<span class="pill warn">확인 필요</span>';

  // 노선 구간별 요금 (한국 출발 편도, 32kg 이하)
  function feeFor(a,c){
    const f=a.fees||{}, n=a.feeNum||{};
    if(a.status==='pending') return {num:null,text:'확인 대기'};
    if(f.longOnly && c.region==='long' && !f.longOnly.includes(c.id)) return {num:null,text:'요금표 없음 · 노선 확인'};
    if(n[c.region]==null) return {num:null,text:'해당 노선 없음'};
    return {num:n[c.region], text:f[c.region]||n[c.region].toLocaleString('ko-KR')+'원'};
  }
  const telList = a => (a.contact||[]).map(p=>`<div class="tel"><span class="muted">${esc(p.label)}</span> <strong class="mono sel">${esc(p.tel)}</strong>${p.alt?` <span class="mono muted">/ ${esc(p.alt)}</span>`:''}${p.hours?`<div class="hint">${esc(p.hours)}</div>`:''}</div>`).join('');
  const isBrachyBreed = q => { q=(q||'').replace(/\s/g,''); if(!q) return null; return DATA.airlines.filter(a=>a.brachyList&&a.brachyList.some(b=>{b=b.replace(/\s/g,'');return b.includes(q)||q.includes(b);})).map(a=>a.name); };

  function viewFlights(){
    const fd = state.fdest || state.dest;
    const opts = DATA.countries.map(c=>`<option value="${c.id}" ${c.id===fd?'selected':''}>${esc(c.name)}</option>`).join('');
    app.innerHTML = `
    <div class="grid-plan">
      <form class="sheet form" id="fform" autocomplete="off">
        <div><div class="eyebrow">한국 출발</div><h2 style="font-size:20px;margin-top:4px">우리 개는 어느 항공사로 갈 수 있을까</h2></div>
        <div class="field"><label for="fdest">목적지</label><select id="fdest">${opts}</select></div>
        <div class="field"><label for="fwt">반려견 + 운반용기 무게 (kg)</label><input type="number" id="fwt" min="0.5" max="60" step="0.1" value="${state.weight}"></div>
        <div class="field"><label for="fbreed">견종</label><input type="text" id="fbreed" placeholder="예: 푸들, 시추, 치와와" value="${esc(state.breed||'')}"><p class="hint" id="fbreedOut"></p></div>
        <label class="check"><input type="checkbox" id="fbrachy" ${state.brachy?'checked':''}><span>단두종 또는 단두종 교배종</span></label>
        <p class="hint">검역 일정은 <a href="#plan">일정 계산</a>에서, 항공사 전체 규정은 <a href="#airlines">항공사 비교</a>에서 볼 수 있습니다.</p>
      </form>
      <section id="fresult" aria-live="polite" style="display:flex;flex-direction:column;gap:14px;min-width:0"></section>
    </div>`;
    const f=id=>document.getElementById(id);
    f('fform').addEventListener('submit',e=>e.preventDefault());
    f('fdest').addEventListener('change',e=>{state.fdest=e.target.value;state.dest=e.target.value;save();renderFlights();});
    f('fwt').addEventListener('input',e=>{state.weight=e.target.value;save();renderFlights();});
    f('fbrachy').addEventListener('change',e=>{state.brachy=e.target.checked;save();renderFlights();});
    f('fbreed').addEventListener('input',e=>{state.breed=e.target.value;const hit=isBrachyBreed(state.breed);if(hit&&hit.length){state.brachy=true;f('fbrachy').checked=true;}save();renderFlights();});
    renderFlights();
  }

  function renderFlights(){
    const c = DATA.countries.find(x=>x.id===(state.fdest||state.dest)); const el=document.getElementById('fresult'); if(!c||!el) return;
    const hit = isBrachyBreed(state.breed); const bo=document.getElementById('fbreedOut');
    if(bo) bo.innerHTML = !state.breed ? '' : (hit&&hit.length ? `<span class="pill bad">단두종 목록</span> ${esc(hit.join(', '))} 기준` : '<span class="pill ok">단두종 목록에 없음</span> 교배종은 항공사 확인');
    const w = Number(state.weight)||0;
    if(cargoOnly(c.id)){
      el.innerHTML = `<div class="sheet"><div class="eyebrow">${esc(c.name)}</div><div class="big" style="font-family:var(--f-display);font-size:26px;font-weight:500;margin:4px 0 8px">객실·위탁 모두 불가, 화물 운송만 가능</div>
        <p style="margin:0">${esc(c.airlineNote)}</p>
        <div class="callout info"><strong>이렇게 준비하세요</strong>승인 경로를 운항하는 항공사 화물로 보내야 해서 보호자가 직접 예약하기 어렵습니다. 반려동물 운송대행사에 견적을 받는 것이 일반적입니다. 보호자는 같은 날 여객기로 따로 이동합니다.</div></div>`;
      return;
    }
    const rows = DATA.airlines.map(a=>{ const r=airlineFor(a,c); const fee=feeFor(a,c); let tier;
      if(a.status==='pending') tier=3; else if(fee.num==null) tier=4; else if(r.cabin===true) tier=0; else if(r.checked===true) tier=1; else tier=2;
      return {a,r,fee,tier}; });
    rows.sort((x,y)=>x.tier-y.tier || (x.fee.num??1e9)-(y.fee.num??1e9));
    const groups=[[0,'기내에 함께 탈 수 있어요','ok'],[1,'위탁 수하물(화물칸)로 갈 수 있어요','warn'],[2,'이 조건으로는 탈 수 없어요','bad'],[4,'이 노선 요금표가 없어요','info'],[3,'규정 확인 대기','info']];
    el.innerHTML = `<div class="sheet" style="padding:14px 20px"><span class="eyebrow">${esc(c.name)} · ${regionName[c.region]} · ${w}kg${state.brachy?' · 단두종':''}</span></div>` + groups.map(([t,title,tone])=>{
      const g=rows.filter(x=>x.tier===t); if(!g.length) return '';
      return `<section><h3 class="section-h" style="margin-top:4px"><span class="pill ${tone}">${g.length}</span> ${title}</h3><div class="alist">${g.map(({a,r,fee})=>`
        <article class="acard">
          <div class="row"><h4>${esc(a.name)}</h4><span class="mono" style="font-weight:600">${esc(fee.num?fee.num.toLocaleString('ko-KR')+'원':'')}</span></div>
          ${a.banner?`<p class="hint" style="color:var(--warn)">${esc(a.banner)}</p>`:''}
          <div class="row"><span>기내</span>${yn(r.cabin)}</div><div class="row"><span>위탁</span>${yn(r.checked)}</div>
          ${r.reason.length?`<p class="hint">${esc(r.reason.join(' · '))}</p>`:''}
          ${fee.num==null?`<p class="hint">${esc(fee.text)}</p>`:''}
          ${a.booking?`<p class="hint"><strong>신청</strong> ${esc(a.booking)}</p>`:''}
          ${telList(a)}
          <a href="${esc(a.source.url)}" target="_blank" rel="noopener" style="font-size:13px">공식 규정 페이지</a>
        </article>`).join('')}</div></section>`; }).join('') +
      `<p class="hint">요금은 한국 출발 편도, 케이지 포함 32kg 이하 기준. 이 노선을 실제로 운항하는지는 예약 전에 항공사에 확인하세요. 번호는 선택해서 복사할 수 있습니다.</p>`;
  }

  // ---------- views ----------
  function viewPlan(){
    const opts = DATA.countries.map(c=>`<option value="${c.id}" ${c.id===state.dest?'selected':''}>${esc(c.name)}</option>`).join('');
    app.innerHTML = `
    <div class="grid-plan">
      <form class="sheet form" id="pform" autocomplete="off">
        <div class="field"><label for="dest">목적지</label><select id="dest">${opts}</select></div>
        <div class="field"><label for="dep">희망 출국일</label><input type="date" id="dep" value="${state.dep}"></div>
        <div class="field"><label for="wt">반려견 + 운반용기 무게 (kg)</label><input type="number" id="wt" min="0.5" max="60" step="0.1" value="${state.weight}"><p class="hint">항공사 기준은 케이지를 포함한 총무게입니다.</p></div>
        <label class="check"><input type="checkbox" id="chip" ${state.chip?'checked':''}><span>ISO 마이크로칩 이식 완료</span></label>
        <label class="check"><input type="checkbox" id="brachy" ${state.brachy?'checked':''}><span>단두종 또는 단두종 교배종<br><span class="hint">시추·퍼그·치와와 등. 목록은 항공사 비교 탭에서 확인</span></span></label>
        <label class="check"><input type="checkbox" id="titer" ${state.titer?'checked':''}><span>광견병 항체가 검사 채혈 완료 (0.5 IU/ml 이상)</span></label>
        <div class="sub" id="bloodwrap" ${state.titer?'':'hidden'}><label for="blood" class="lbl" style="font-size:13px">채혈일</label><input type="date" id="blood" value="${state.blood}"></div>
      </form>
      <section class="sheet" id="result" aria-live="polite"></section>
    </div>`;
    const f = id => document.getElementById(id);
    const bind = (id,key,prop='value') => f(id).addEventListener('input',e=>{ state[key]= prop==='checked'?e.target.checked:e.target.value; if(id==='titer') f('bloodwrap').hidden=!state.titer; save(); renderResult(); });
    bind('dest','dest'); bind('dep','dep'); bind('wt','weight'); bind('chip','chip','checked'); bind('brachy','brachy','checked'); bind('titer','titer','checked'); bind('blood','blood');
    f('dest').addEventListener('change',e=>{state.dest=e.target.value;save();renderResult();});
    f('pform').addEventListener('submit',e=>e.preventDefault());
    renderResult();
  }

  function renderResult(){
    const c = DATA.countries.find(x=>x.id===state.dest);
    const el = document.getElementById('result'); if(!c||!el) return;
    const earl = earliest(c);
    const dep = parse(state.dep);
    let stamp, big, sub;
    if(!dep){ stamp='<span class="stamp warn">날짜 미입력</span>'; big=fmt(earl); sub='지금 준비를 시작하면 가장 빠른 출국 가능일'; }
    else if(dep>=earl){ stamp='<span class="stamp ok">일정 가능</span>'; big=fmt(dep); sub='여유 '+diff(dep,earl)+'일 · 가장 빠른 날 '+fmt(earl); }
    else { stamp='<span class="stamp bad">일정 불가</span>'; big=fmt(earl); sub='희망일보다 '+diff(earl,dep)+'일 늦은 날이 가장 빠른 출국일'; }
    const base = dep && dep>=earl ? dep : earl;
    const tl = c.timeline.map(s=>{ const d=addDays(base,s.d); const past=d<today; return `<li class="${past?'past':''}"><span class="dt">${fmt(d)}</span><span class="dot"></span><span>${esc(s.t)}${past?' <span class="pill bad">이미 지남</span>':''}</span></li>`; }).join('');
    const air = DATA.airlines.map(a=>{
      const r = airlineFor(a,c);
      const fee = esc(feeFor(a,c).text);
      return `<div class="acard"><h4>${esc(a.name)}</h4>
        <div class="row"><span>기내 동반</span>${yn(r.cabin)}</div>
        <div class="row"><span>위탁 수하물</span>${yn(r.checked)}</div>
        <div class="row"><span class="muted">${regionName[c.region]} 요금</span><span style="text-align:right">${fee}</span></div>
        ${r.reason.length?`<p class="hint">${esc(r.reason.join(' · '))}</p>`:''}</div>`;
    }).join('');
    const warns = [];
    if(!state.chip) warns.push('<div class="callout bad"><strong>마이크로칩부터</strong>대부분의 나라가 광견병 접종보다 먼저 이식한 칩만 인정합니다. 칩 없이 맞은 접종은 다시 맞아야 할 수 있습니다.</div>');
    if(titerCountry(c.id) && !state.titer) warns.push('<div class="callout warn"><strong>항체가 검사가 일정을 결정합니다</strong>'+esc(c.leadNote)+'.</div>');
    if(c.id==='us' && state.titer===false) {}
    if(cargoOnly(c.id)) warns.push('<div class="callout bad"><strong>화물 운송만 가능</strong>'+esc(c.airlineNote)+'</div>');
    if(state.brachy) warns.push('<div class="callout warn"><strong>단두종</strong>대한항공·아시아나·에어프레미아는 단두종 위탁을 받지 않습니다. 기내 무게 한도(7kg) 안이어야 함께 갈 수 있습니다.</div>');
    el.innerHTML = `
      <div class="verdict">
        <div><div class="eyebrow">${esc(c.name)} · ${esc(c.status)}</div><div class="big mono">${big}</div><div class="muted" style="font-size:14px">${sub}</div></div>
        <div style="margin-left:auto">${stamp}</div>
      </div>
      ${warns.join('')}
      <h3 class="section-h">준비 일정</h3>
      <ol class="tl">${tl}</ol>
      <p class="hint" style="margin-top:6px">날짜는 출국일에서 거꾸로 계산한 권장 시점입니다. <a href="#${c.id}">${esc(c.name)} 전체 요건 보기</a></p>
      <h3 class="section-h">이 노선에서 탈 수 있는 항공사 <span class="muted" style="font-weight:400;font-size:13px">(${state.weight}kg 기준, 운항 여부는 항공사 확인)</span></h3>
      <div class="alist">${air}</div>
      <div class="callout info"><strong>돌아올 때</strong>${esc(c.returnNote)} <a href="#return">귀국 검역 보기</a></div>`;
  }

  // ---------- storage (per-viewer convenience only) ----------
  function save(){ try{ localStorage.setItem('pp3', JSON.stringify(state)); }catch(e){} }
  function load(){ try{ Object.assign(state, JSON.parse(localStorage.getItem('pp3')||'{}')); }catch(e){} }
  function loadChecks(id){ try{ return JSON.parse(localStorage.getItem('pp3c-'+id)||'[]'); }catch(e){ return []; } }
  function saveChecks(id,v){ try{ localStorage.setItem('pp3c-'+id, JSON.stringify(v)); }catch(e){} }

  // ---------- router ----------
  function route(){
    const h = (location.hash||'#flights').slice(1);
    const c = DATA.countries.find(x=>x.id===h);
    const tab = c ? 'countries' : (['flights','plan','countries','airlines','return','about'].includes(h)?h:'flights');
    document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current', a.dataset.tab===tab?'page':'false'));
    if(c) viewCountry(c);
    else ({flights:viewFlights,plan:viewPlan,countries:viewCountries,airlines:viewAirlines,return:viewReturn,about:viewAbout})[tab]();
    if(c) window.scrollTo({top:0});
  }

  load();
  if(!state.dep) state.dep = iso(addMonths(today,8));
  fetch('data.json').then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(d=>{ DATA=d; document.getElementById('vdate').textContent=d.meta.verified; route(); window.addEventListener('hashchange',route); })
    .catch(()=>{ app.innerHTML='<div class="callout bad"><strong>규정 데이터를 불러오지 못했습니다</strong>페이지를 새로고침해 주세요.</div>'; });
